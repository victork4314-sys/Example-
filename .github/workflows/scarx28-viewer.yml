name: Scarx28 Viewer Trace
on: pull_request
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Git LFS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git-lfs >/dev/null
          git lfs install
      - name: Pull PMC crawl and grep Scarx28
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/pmc-crawl viewer-out
          mkdir -p viewer-out
          export GIT_LFS_SKIP_SMUDGE=1
          git clone --depth 1 https://github.com/erzar0/MC.git /tmp/pmc-crawl
          cd /tmp/pmc-crawl
          git lfs install --local
          git lfs pull --include='data/pipeline/pmc_data_cleansed.csv' --exclude=''
          wc -c data/pipeline/pmc_data_cleansed.csv > "$GITHUB_WORKSPACE/viewer-out/size.txt"
          head -n 1 data/pipeline/pmc_data_cleansed.csv > "$GITHUB_WORKSPACE/viewer-out/header.txt"
          grep -i -m 50 -E 'regional-airport-project-1-1|Scarx28' data/pipeline/pmc_data_cleansed.csv > "$GITHUB_WORKSPACE/viewer-out/matches.txt" || true
          wc -l "$GITHUB_WORKSPACE/viewer-out/matches.txt" > "$GITHUB_WORKSPACE/viewer-out/match-count.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scarx28-viewer-trace
          path: viewer-out/
          retention-days: 1
