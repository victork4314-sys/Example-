name: Scarx28 Viewer Trace
on: pull_request
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact Scarx28 airport source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf viewer-out
          mkdir -p viewer-out
          urls=(
            'https://s3.amazonaws.com/static.planetminecraft.com/files/resource_media/schematic/regional-airport.zip?response-content-encoding=gzip&response-content-type=text/plain'
            'https://s3.amazonaws.com/static.planetminecraft.com/files/resource_media/schematic/regional-airport.zip'
            'https://static.planetminecraft.com/files/resource_media/schematic/regional-airport.zip'
          )
          ok=0
          : > viewer-out/attempts.txt
          for u in "${urls[@]}"; do
            echo "$u" >> viewer-out/attempts.txt
            curl -fL --retry 2 --connect-timeout 30 --max-time 180 -A 'Mozilla/5.0' "$u" -o viewer-out/candidate.bin || continue
            file viewer-out/candidate.bin >> viewer-out/attempts.txt || true
            wc -c viewer-out/candidate.bin >> viewer-out/attempts.txt || true
            if unzip -t viewer-out/candidate.bin >/dev/null 2>&1; then
              mv viewer-out/candidate.bin viewer-out/regional-airport.zip
              unzip -l viewer-out/regional-airport.zip > viewer-out/zip-list.txt
              sha256sum viewer-out/regional-airport.zip > viewer-out/sha256.txt
              ok=1
              break
            fi
          done
          test "$ok" = 1
      - uses: actions/upload-artifact@v4
        with:
          name: scarx28-viewer-trace
          path: viewer-out/
          retention-days: 1
