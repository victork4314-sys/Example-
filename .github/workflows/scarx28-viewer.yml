name: Scarx28 Viewer Trace
on: pull_request
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Trace viewer
        run: |
          mkdir -p viewer-out
          cat > trace.js <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({userAgent:'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'});
            const page=await ctx.newPage();
            const log=[];
            page.on('request',r=>log.push('REQ\t'+r.resourceType()+'\t'+r.url()));
            page.on('response',async r=>{
              const h=await r.allHeaders();
              log.push('RES\t'+r.status()+'\t'+(h['content-type']||'')+'\t'+r.url());
            });
            try{
              await page.goto('https://www.planetminecraft.com/project/regional-airport-project-1-1/tab_schemagic',{waitUntil:'domcontentloaded',timeout:120000});
              await page.waitForTimeout(30000);
              fs.writeFileSync('viewer-out/title.txt',await page.title());
              fs.writeFileSync('viewer-out/url.txt',page.url());
              fs.writeFileSync('viewer-out/page.html',await page.content());
              await page.screenshot({path:'viewer-out/page.png',fullPage:true});
            }catch(e){fs.writeFileSync('viewer-out/error.txt',String(e&&e.stack||e));}
            fs.writeFileSync('viewer-out/network.txt',log.join('\n'));
            await browser.close();
          })().catch(e=>fs.writeFileSync('viewer-out/fatal.txt',String(e&&e.stack||e)));
          EOF
          node trace.js
          grep -Ei 'schem|world|3d|view|ajax|resource_media|download|api|blob' viewer-out/network.txt > viewer-out/interesting.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scarx28-viewer-trace
          path: viewer-out/
          retention-days: 1
