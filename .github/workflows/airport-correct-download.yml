name: Airport Correct Download

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  fetch:
    if: github.event.issue.title == 'RUN AIRPORT CORRECT DOWNLOAD'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and fetch Scarx28 airport
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf airport-correct-download
          mkdir -p airport-correct-download
          URL='https://www.planetminecraft.com/project/regional-airport-project-1-1/download/'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'

          # Try direct resolver exactly like known PMC downloader implementations.
          curl -sS -A "$UA" -D airport-correct-download/headers.txt -o airport-correct-download/body.bin --max-time 120 "$URL" || true
          file airport-correct-download/body.bin > airport-correct-download/filetype.txt || true
          wc -c airport-correct-download/body.bin > airport-correct-download/size.txt || true
          grep -i '^location:' airport-correct-download/headers.txt > airport-correct-download/location.txt || true

          # Follow redirect if one exists.
          LOC=$(sed -n 's/^[Ll]ocation:[[:space:]]*//p' airport-correct-download/headers.txt | tr -d '\r' | tail -1)
          if [ -n "$LOC" ]; then
            printf '%s\n' "$LOC" > airport-correct-download/resolved-url.txt
            curl -L -sS -A "$UA" --max-time 180 -D airport-correct-download/resolved-headers.txt -o airport-correct-download/Scarx28-Regional-Airport-Project.download "$LOC" || true
          fi

          # If PMC directly served an archive, keep it.
          if python3 - <<'PY'
from pathlib import Path
p=Path('airport-correct-download/body.bin')
b=p.read_bytes() if p.exists() else b''
raise SystemExit(0 if b[:4] == b'PK\x03\x04' else 1)
PY
          then
            mv airport-correct-download/body.bin airport-correct-download/Scarx28-Regional-Airport-Project.zip
          fi

          # Check followed payload and rename if ZIP.
          if [ -f airport-correct-download/Scarx28-Regional-Airport-Project.download ]; then
            if python3 - <<'PY'
from pathlib import Path
p=Path('airport-correct-download/Scarx28-Regional-Airport-Project.download')
b=p.read_bytes()
raise SystemExit(0 if b[:4] == b'PK\x03\x04' else 1)
PY
            then
              mv airport-correct-download/Scarx28-Regional-Airport-Project.download airport-correct-download/Scarx28-Regional-Airport-Project.zip
            fi
          fi

          # Save a readable preview if not archive.
          python3 - <<'PY'
from pathlib import Path
for name in ['body.bin','Scarx28-Regional-Airport-Project.download']:
    p=Path('airport-correct-download')/name
    if p.exists():
        b=p.read_bytes()
        if b[:4] != b'PK\x03\x04':
            (Path('airport-correct-download')/(name+'.txt')).write_text(b[:100000].decode('utf-8','ignore'), encoding='utf-8')
PY

          git config user.name airport-fetch-bot
          git config user.email airport-fetch-bot@users.noreply.github.com
          git add -f airport-correct-download
          git commit -m 'Correct PMC airport download result' || exit 0
          git push
