name: Analyze Scarx28 Airport

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  analyze:
    if: github.event.issue.title == 'RUN SCARX28 AIRPORT ANALYSIS'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Amulet
        run: |
          python -m pip install --upgrade pip
          pip install 'amulet-core==1.9.29' pillow
      - name: Unpack exact Scarx28 source
        run: |
          rm -rf work airport-analysis
          mkdir -p work
          unzip -q origin-probe/6.bin -d work
          test -f 'work/Regional Airport/level.dat'
      - name: Analyze airport bounds and palettes
        run: python scripts/analyze_scarx28_airport.py
      - name: Commit analysis
        if: always()
        shell: bash
        run: |
          git config user.name airport-fetch-bot
          git config user.email airport-fetch-bot@users.noreply.github.com
          git add -f airport-analysis 2>/dev/null || true
          git commit -m 'Scarx28 airport analysis result' || exit 0
          git push
