name: Airport Schematic Direct Probe

on:
  pull_request:
    paths:
      - airport-schematic-probe-trigger.txt

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Scarx28 download
        shell: bash
        run: |
          mkdir -p schematic-probe
          curl --silent --show-error --max-time 120 \
            --user-agent 'Mozilla/5.0' \
            --dump-header schematic-probe/headers.txt \
            --output schematic-probe/body.bin \
            'https://www.planetminecraft.com/project/regional-airport-project-1-1/download/' || true
          grep -i '^location:' schematic-probe/headers.txt > schematic-probe/location.txt || true
          file schematic-probe/body.bin > schematic-probe/filetype.txt || true
          wc -c schematic-probe/body.bin > schematic-probe/size.txt || true
          cat schematic-probe/headers.txt
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airport-schematic-probe-results
          path: schematic-probe/
          retention-days: 1
