name: Scarx28 Airport Analysis PR

on:
  pull_request:
    paths:
      - airport-analysis-trigger.txt

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install Amulet
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install 'amulet-core==1.9.29' pillow
          python - <<'PY'
import amulet
print('Amulet', getattr(amulet,'__version__','unknown'))
PY
      - name: Unpack exact Scarx28 source
        run: |
          rm -rf work airport-analysis
          mkdir -p work
          unzip -q origin-probe/6.bin -d work
          test -f 'work/Regional Airport/level.dat'
      - name: Analyze exact world
        run: python scripts/analyze_scarx28_airport.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scarx28-airport-analysis
          path: airport-analysis/
          if-no-files-found: warn
          retention-days: 1
