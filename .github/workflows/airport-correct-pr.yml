name: Airport Correct Download PR

on:
  pull_request:
    paths:
      - airport-correct-trigger.txt

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Scarx28 through correct PMC endpoint
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p airport-correct-pr
          URL='https://www.planetminecraft.com/project/regional-airport-project-1-1/download/'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
          curl -sS -A "$UA" --max-time 120 -D airport-correct-pr/headers.txt -o airport-correct-pr/body.bin "$URL" || true
          grep -i '^location:' airport-correct-pr/headers.txt > airport-correct-pr/location.txt || true
          file airport-correct-pr/body.bin > airport-correct-pr/filetype.txt || true
          wc -c airport-correct-pr/body.bin > airport-correct-pr/size.txt || true
          LOC=$(sed -n 's/^[Ll]ocation:[[:space:]]*//p' airport-correct-pr/headers.txt | tr -d '\r' | tail -1)
          if [ -n "$LOC" ]; then
            printf '%s\n' "$LOC" > airport-correct-pr/resolved-url.txt
            curl -L -sS -A "$UA" --max-time 180 -D airport-correct-pr/resolved-headers.txt -o airport-correct-pr/resolved.bin "$LOC" || true
          fi
          python3 - <<'PY'
from pathlib import Path
for src in ['body.bin','resolved.bin']:
 p=Path('airport-correct-pr')/src
 if not p.exists(): continue
 b=p.read_bytes()
 if b[:4]==b'PK\x03\x04':
  out=Path('airport-correct-pr/Scarx28-Regional-Airport-Project.zip')
  out.write_bytes(b)
 else:
  (Path('airport-correct-pr')/(src+'.txt')).write_text(b[:200000].decode('utf-8','ignore'),encoding='utf-8')
PY
      - name: Upload resolver output
        uses: actions/upload-artifact@v4
        with:
          name: airport-correct-pr-result
          path: airport-correct-pr/
          retention-days: 1
