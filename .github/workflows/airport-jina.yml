name: Airport Jina Recovery

on:
  pull_request:
    paths:
      - airport-jina-trigger.txt

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch PMC through Jina Reader
        shell: bash
        run: |
          set +e
          mkdir -p jina-out
          urls=(
            'https://r.jina.ai/http://www.planetminecraft.com/project/regional-airport-project-1-1/'
            'https://r.jina.ai/https://www.planetminecraft.com/project/regional-airport-project-1-1/'
            'https://r.jina.ai/http://www.planetminecraft.com/project/regional-airport-project-1-1/download/worldmap/'
            'https://r.jina.ai/https://www.planetminecraft.com/project/regional-airport-project-1-1/download/worldmap/'
          )
          i=0
          for u in "${urls[@]}"; do
            i=$((i+1))
            curl -L --max-time 90 -A 'Mozilla/5.0' -D "jina-out/$i.headers" -o "jina-out/$i.body" "$u"
            file "jina-out/$i.body" >> jina-out/files.txt
            wc -c "jina-out/$i.body" >> jina-out/files.txt
          done
          grep -RinE 'download|resource_media|static\.planetminecraft|mediafire|dropbox|drive\.google|mega\.nz|\.zip|\.schem|\.schematic|worldmap' jina-out > jina-out/HITS.txt || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airport-jina-results
          path: jina-out/
          retention-days: 1
