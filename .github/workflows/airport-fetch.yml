name: Airport Source Fetch

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  fetch-source:
    if: contains(fromJSON('["RUN AIRPORT SOURCE FETCH","RUN AIRPORT STATIC PROBE","RUN AIRPORT WAYBACK PROBE","RUN AIRPORT WAYBACK FAST","RUN AIRPORT COMMONCRAWL","RUN AIRPORT ORIGIN PROBE","RUN AIRPORT DATASET LOOKUP"]'), github.event.issue.title)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run requested airport source job
        continue-on-error: true
        shell: bash
        run: |
          case "${{ github.event.issue.title }}" in
            'RUN AIRPORT STATIC PROBE') bash scripts/probe_airport_static.sh ;;
            'RUN AIRPORT WAYBACK PROBE') bash scripts/probe_airport_wayback.sh ;;
            'RUN AIRPORT WAYBACK FAST') bash scripts/probe_airport_wayback_fast.sh ;;
            'RUN AIRPORT COMMONCRAWL') python3 scripts/probe_airport_commoncrawl.py ;;
            'RUN AIRPORT ORIGIN PROBE') bash scripts/airport_origin_probe.sh ;;
            'RUN AIRPORT DATASET LOOKUP')
              set -euxo pipefail
              rm -rf /tmp/pmc-crawl dataset-lookup
              mkdir -p dataset-lookup
              sudo apt-get update -qq
              sudo apt-get install -y git-lfs >/dev/null
              export GIT_LFS_SKIP_SMUDGE=1
              git clone --depth 1 https://github.com/erzar0/MC.git /tmp/pmc-crawl
              cd /tmp/pmc-crawl
              git lfs install --local
              git lfs pull --include='data/pipeline/pmc_data_cleansed.csv' --exclude=''
              wc -c data/pipeline/pmc_data_cleansed.csv > "$GITHUB_WORKSPACE/dataset-lookup/size.txt"
              head -n 1 data/pipeline/pmc_data_cleansed.csv > "$GITHUB_WORKSPACE/dataset-lookup/header.txt"
              grep -i -m 100 -E 'regional-airport-project-1-1|Scarx28' data/pipeline/pmc_data_cleansed.csv > "$GITHUB_WORKSPACE/dataset-lookup/matches.txt" || true
              wc -l "$GITHUB_WORKSPACE/dataset-lookup/matches.txt" > "$GITHUB_WORKSPACE/dataset-lookup/match-count.txt"
              cd "$GITHUB_WORKSPACE"
              ;;
            *) bash scripts/airport_fetch.sh ;;
          esac
      - name: Commit recovery output
        if: always()
        shell: bash
        run: |
          git config user.name airport-fetch-bot
          git config user.email airport-fetch-bot@users.noreply.github.com
          git add -f cc-probe wayback-fast wayback-probe static-probe airport-fetch-output origin-probe dataset-lookup 2>/dev/null || true
          git commit -m 'Airport recovery probe output' || exit 0
          git push
