name: Airport Source Fetch

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  fetch-source:
    if: github.event.issue.title == 'RUN AIRPORT SOURCE FETCH' || github.event.issue.title == 'RUN AIRPORT STATIC PROBE'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run requested airport source job
        shell: bash
        run: |
          if [ "${{ github.event.issue.title }}" = "RUN AIRPORT STATIC PROBE" ]; then
            bash scripts/probe_airport_static.sh
          else
            bash scripts/airport_fetch.sh
          fi
