name: Airport Source Fetch

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  fetch-source:
    if: github.event.issue.title == 'RUN AIRPORT SOURCE FETCH'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact Scarx28 airport source
        run: bash scripts/airport_fetch.sh
